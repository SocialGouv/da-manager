apiVersion: v1
kind: Service
metadata:
  name: {{ include "da-manager.fullname" . }}
  labels:
    {{- include "da-manager.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "da-manager.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
