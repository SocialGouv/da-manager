# pnpm 10 : les réglages ont migré du champ "pnpm" de package.json vers ce fichier.
#
# Par défaut pnpm refuse d'exécuter les scripts de build non approuvés
# (strictDepBuilds=true) -> ERR_PNPM_IGNORED_BUILDS. On autorise UNIQUEMENT les
# dépendances natives qui en ont réellement besoin (pas d'autorisation globale).
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  unrs-resolver: true
